name: Site notifier

on:
    schedule:
        - cron: "*/15 * * * *"
    workflow_dispatch:

jobs:
    notify:
        name: Update News
        runs-on: ubuntu-latest
        permissions:
            issues: write

        steps:
            - uses: actions/checkout@v7

            - name: State cache
              uses: actions/cache@v6
              with:
                  path: state.json
                  key: notifier-state-${{ github.run_id }}-${{ github.run_attempt }}
                  restore-keys: |
                      notifier-state-

            - name: Install uv
              uses: astral-sh/setup-uv@v7

            - name: Install dependencies
              run: uv sync

            - name: Update News
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GITHUB_REPOSITORY: ${{ github.repository }}
                  FORCE_RECHECK: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
                  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
              run: source .venv/bin/activate && python sites.py
